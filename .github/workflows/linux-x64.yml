name: linux-x64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build and SDL3 development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl3-dev

      - name: Build default members
        run: |
          cargo build --locked --release --target x86_64-unknown-linux-gnu

      - name: Package default-member binaries
        run: python3 .github/scripts/package-default-binaries.py target/x86_64-unknown-linux-gnu/release dist

      - uses: actions/upload-artifact@v4
        with:
          name: games-linux-x64
          path: dist/
          if-no-files-found: error
