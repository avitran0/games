name: Games

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      RUSTFLAGS: -C target-feature=+crt-static -C link-arg=-static
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libudev-dev libusb-1.0-0-dev libdbus-1-dev

      - name: Build
        run: cargo build --release --target aarch64-unknown-linux-gnu

      - name: Create Ports archive
        run: |
          mkdir -p dist
          python3 .github/scripts/stage-binaries.py \
            target/aarch64-unknown-linux-gnu/release dist
          file dist/games-ports-aarch64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: games-aarch64
          path: dist/games-ports-aarch64.zip
          if-no-files-found: error
