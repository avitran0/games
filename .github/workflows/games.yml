name: Games

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install SDL3 build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake ninja-build pkg-config \
            libdrm-dev libgbm-dev libegl1-mesa-dev libgles2-mesa-dev \
            libasound2-dev libudev-dev libusb-1.0-0-dev libdbus-1-dev \
            libwayland-dev libwayland-bin wayland-protocols \
            libxkbcommon-dev libdecor-0-dev

      - name: Build games and PXS converter
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
          cargo build -p pxs-to-png --release --target aarch64-unknown-linux-gnu

      - name: Stage Ports layout
        run: |
          mkdir -p dist
          python3 .github/scripts/stage-binaries.py \
            target/aarch64-unknown-linux-gnu/release dist
          find dist -maxdepth 2 -type f -exec file {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: games-aarch64
          path: dist/
          if-no-files-found: error
