name: rocknix-arm64

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04-arm
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "8"

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build and SDL3 development dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config libsdl3-dev

      - name: Build games and PXS converter
        run: |
          cargo build --locked --release --target aarch64-unknown-linux-gnu
          cargo build --locked -p pxs-to-png --release --target aarch64-unknown-linux-gnu
          cargo build --locked -p updater --release --target aarch64-unknown-linux-gnu

      - name: Stage Ports layout
        run: |
          mkdir -p dist
          python3 .github/scripts/stage-binaries.py \
            target/aarch64-unknown-linux-gnu/release dist
          find dist -maxdepth 2 -type f -exec file {} \;

      - uses: actions/upload-artifact@v4
        with:
          name: games-rocknix-arm64
          path: dist/
          if-no-files-found: error
