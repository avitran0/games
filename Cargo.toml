[workspace]
members = ["api", "editor", "factory", "formats", "pong", "snake", "tools/pxs-to-png", "ui", "ui-demo"]
default-members = ["factory", "pong", "snake"]
resolver = "3"

[workspace.dependencies]
api.path = "api"
formats.path = "formats"
ui.path = "ui"
strum = { version = "0.28", features = ["derive"] }

[profile.release]
debug = true
