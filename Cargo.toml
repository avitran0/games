[workspace]
members = [
    "api/api",
    "api/editor",
    "api/formats",
    "api/pxs-to-png",
    "api/ui",
    "api/ui-demo",
    "api/updater",
    "minesweeper",
    "pong",
    "snake",
    "tower-defense",
]
default-members = ["minesweeper", "pong", "snake", "tower-defense"]
resolver = "3"

[workspace.dependencies]
api.path = "api/api"
formats.path = "api/formats"
ui.path = "api/ui"

glam = { version = "0.34", features = ["serde"] }
uuid = "1.28"
thiserror = "2.0"
