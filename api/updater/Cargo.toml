[package]
name = "updater"
version = "0.1.0"
edition = "2024"

[dependencies]
api.workspace = true
ui.workspace = true
serde_json = "1.0"
ureq = { version = "3.4", features = ["json"] }
zip = { version = "9.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
] }
xmltree = "0.12"
