[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
utils.git = "https://codeberg.org/avitrano/utils"
# for asset hashing
blake3 = "1.8"
egui = { version = "0.37", features = ["default_fonts"] }
egui_glow = "0.37"
glam.workspace = true
formats.workspace = true
# this is unfortunately deliberately out of date, until egui_glow updates
glow = "0.17"
serde = { version = "1.0", features = ["derive"] }
sdl3 = "0.22"
strum = { version = "0.28", features = ["derive"] }
thiserror.workspace = true
toml = "1.1"
uuid.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
sdl3 = { version = "0.22", features = ["build-from-source"] }
