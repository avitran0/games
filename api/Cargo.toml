[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
utils.git = "https://codeberg.org/avitrano/utils"
# for asset hashing
blake3 = "1.8"
glam = "0.34"
formats.workspace = true
glow = "0.18"
serde = { version = "1.0", features = ["derive"] }
sdl3 = { version = "0.20", features = ["build-from-source-static"] }
thiserror = "2.0"
toml = "1.1"
uuid = { version = "1.27", features = ["v4"] }
